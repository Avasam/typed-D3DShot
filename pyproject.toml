[build-system]
requires = ["hatchling", "hatch-mypyc"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["d3dshot"]

# Compile the pure-Python capture path with mypyc.
[tool.hatch.build.targets.wheel.hooks.mypyc]
# Off by default so `uv build` / `uv sync` stay pure-Python (no compiler needed,
# produces the non-version-locked py3-none-any wheel). Release CI turns it on with
# HATCH_BUILD_HOOK_ENABLE_MYPYC=1 to build the compiled per-version platform wheels.
enable-by-default = false
# Install the extras so mypyc sees real types (better optimization of capture_outputs/).
require-runtime-features = ["numpy", "PIL", "torch"]
require-runtime-dependencies = true
include = ["d3dshot/"]
exclude = [
  # Relies on `if TYPE_CHECKING: ... else: <runtime shim>`; mypyc compiles the
  # else branch as an unreachable trap ("Reached allegedly unreachable code!").
  "d3dshot/_compat.py",
  # DXGI/COM-bound; overloaded __init__ hits a mypyc codegen bug.
  # https://github.com/mypyc/mypyc/issues/961
  "d3dshot/display.py",
  # comtypes COM interface metaprogramming (_iid_, STDMETHOD lists,
  # IUnknown subclassing) is not mypyc-compatible.
  # https://github.com/mypyc/mypyc/issues/1033
  # https://github.com/mypyc/mypyc/issues/1073
  "d3dshot/dll/",
]
options = { opt_level = "3", debug_level = "0" }

[project.urls]
Homepage = "https://github.com/Avasam/D3DShot"
Repository = "https://github.com/Avasam/D3DShot.git"
Issues = "https://github.com/Avasam/D3DShot/issues"
Changelog = "https://github.com/Avasam/D3DShot/blob/HEAD/CHANGELOG.md"

[project]
name = "typed-D3DShot"
version = "1.1.1"
description = "Extremely Fast, Robust, and Typed, Screen Capture on Windows with the Desktop Duplication API"
readme = "README.md"
authors = [{ name = "Nicholas Brochu", email = "nicholas@serpent.ai" }]
maintainers = [{ name = "Avasam", email = "samuel.06@hotmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "Computer Vision",
  "D3D",
  "Desktop Duplication",
  "Direct3D",
  "Screen Capture",
  "Screenshot",
  "Windows",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: Microsoft :: Windows :: Windows 8.1",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Graphics :: Capture",
  "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
requires-python = ">= 3.9"
dependencies = [
  "comtypes >= 1.1.11", # Fixed leftover Python 2 syntax
  "comtypes >= 1.4.8 ; python_version >= '3.13'", # Added Python 3.13 support
]

[project.optional-dependencies]
# First version w/ Image.Transpose enums
# 10.3.0 is the first py.typed, but we can do with simple type inference
PIL = [
  "pillow >= 9.1.0",
  # Older Pillow source builds fail on Python 3.13+ due to setuptools KeyError: '__version__'
  "pillow >= 10.4.0 ; python_version >= '3.13'",
]
numpy = [
  # Fixes distutils removal (Python 3.12) issue with setuptools
  # NumPy 1 is already in maintenance mode anyway
  # Simplify testing and promote dropping usages of distutils
  "numpy >= 1.26.0",
  # First versions with wheels for each Python version
  "numpy >= 2.1.0 ; python_version >= '3.13'",
  "numpy >= 2.3.2 ; python_version >= '3.14'",
  # First version with Windows ARM64 wheels, requires Python 3.11+
  "numpy >= 2.3.0 ; platform_machine == 'ARM64' and python_version >= '3.11'",
]
torch = [
  "typed-D3DShot[numpy]",
  # PyTorch has no Windows ARM64 wheels; skip it there so resolution/build doesn't
  # fail (only 'ARM64' is Windows-ARM; Linux aarch64 / macOS arm64 report differently)
  "torch >= 2.0.0 ; platform_machine != 'ARM64'", # First py.typed version
  # First versions with wheels for each Python version
  "torch >= 2.2.0 ; python_version >= '3.12' and platform_machine != 'ARM64'",
  "torch >= 2.6.0 ; python_version >= '3.13' and platform_machine != 'ARM64'",
  "torch >= 2.9.0 ; python_version >= '3.14' and platform_machine != 'ARM64'",
]

[dependency-groups]
ruff = [
  "beslogic-ruff-config",
  "ruff", # Version should come from beslogic-ruff-config and the lock file
]
dev = [
  "mypy >= 1.19",
  "pyright[nodejs] ~= 1.1.410",
  {include-group = "ruff"},
  "typed-D3DShot[PIL]",
  "typed-D3DShot[numpy]",
  "typed-D3DShot[torch]",
]

[tool.uv]
# Fail fast with a resolver/install error instead of building (then crashing on)
# a native sdist if the wheel-floor markers above ever have a gap
no-build-package = ["numpy", "torch"]
exclude-newer = "1 week"

[tool.uv.sources]
beslogic-ruff-config = { git = "https://github.com/Beslogic/Beslogic-Ruff-Config", rev = "312cfab" }
