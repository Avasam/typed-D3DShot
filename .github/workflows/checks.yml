# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: Checks
on:
  workflow_dispatch: #  Allows manual builds
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  Ruff:
    runs-on: ubuntu-24.04-arm
    env:
      RUFF_OUTPUT_FORMAT: github
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          activate-environment: true
      # NOTE: This is also our only check that validates the lockfile
      # Which is important to ensure stricter resolvers (uv sync vs uv pip) do work
      - run: uv sync --locked --only-group=ruff
      - run: ruff check
      - run: ruff format --check
        # Check format even if the the previous step failed
        if: ${{ !cancelled() }}
  mypy:
    # Not windows-11-arm: PyTorch has no Windows ARM64 wheels,
    # and we want torch installed for full typing coverage
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        resolution: [highest]
        # To save on workflow runtime, only test oldest resolution on extreme ends of Python version
        # This should at least ensure support for oldest combination
        # and let us know when newest dependencies drop support for any Python version
        include:
          - python-version: "3.9"
            resolution: lowest-direct
          - python-version: "3.15"
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@v7
      - &install-pillow-build-dependencies
        name: Install Pillow build dependencies
        if: matrix.resolution == 'lowest-direct'
        env:
          TRIPLET: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-windows
        run: |
          vcpkg install "zlib:$env:TRIPLET" "libjpeg-turbo:$env:TRIPLET"
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\$env:TRIPLET"
          # zlib 1.4 names its MSVC import library libz.lib, but Pillow (all versions up to 13.0.0)
          # only looks for z.lib, zlib.lib or zdll.lib. Remove once no job builds Pillow from source.
          Copy-Item "$root\lib\libz.lib" "$root\lib\zlib.lib"
          "INCLUDE=$root\include" >> $env:GITHUB_ENV
          "LIB=$root\lib" >> $env:GITHUB_ENV
          "VCPKG_BIN=$root\bin" >> $env:GITHUB_ENV
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install the project
        run: uv sync --resolution=${{ matrix.resolution }}
      - run: mypy d3dshot/
  Pyright:
    # Not windows-11-arm: PyTorch has no Windows ARM64 wheels,
    # and we want torch installed for full typing coverage
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        resolution: [highest]
        # To save on workflow runtime, only test oldest resolution on extreme ends of Python version
        # This should at least ensure support for oldest combination
        # and let us know when newest dependencies drop support for any Python version
        include:
          - python-version: "3.13" # Older comtypes too many unmanageable type errors on 3.9
            resolution: lowest-direct
          - python-version: "3.15"
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@v7
      - *install-pillow-build-dependencies
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install the project
        run: uv sync --resolution=${{ matrix.resolution }}
      - name: Analysing the code with Pyright
        uses: jakebailey/pyright-action@v3
        with:
          python-version: ${{ matrix.python-version }}
          version: PATH
          working-directory: d3dshot/
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        resolution: [highest]
        # uv has no Windows ARM64 builds for Python 3.9 and 3.10
        exclude:
          - os: windows-11-arm
            python-version: "3.9"
          - os: windows-11-arm
            python-version: "3.10"
        # To save on workflow runtime, only test oldest resolution on extreme ends of Python version
        # This should at least ensure support for oldest combination
        # and let us know when newest dependencies drop support for any Python version
        #
        # os must be set explicitly: include entries that override resolution
        # become standalone combinations and don't inherit matrix values
        include:
          - os: windows-latest
            python-version: "3.9"
            resolution: lowest-direct
          - os: windows-latest
            python-version: "3.15"
            resolution: lowest-direct
          - os: windows-11-arm
            python-version: "3.11"
            resolution: lowest-direct
          - os: windows-11-arm
            python-version: "3.15"
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@v7
      - *install-pillow-build-dependencies
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install the project
        run: uv sync --no-default-groups --all-extras --resolution=${{ matrix.resolution }}
      # Python 3.8+ LOAD_LIBRARY_SEARCH_DEFAULT_DIRS excludes PATH; use os.add_dll_directory() instead.
      - name: Register vcpkg DLL path via sitecustomize.py for Pillow DLL resolution
        if: matrix.resolution == 'lowest-direct'
        run: |
          "import os; os.add_dll_directory(r'$env:VCPKG_BIN')" | Set-Content ".venv\Lib\site-packages\sitecustomize.py"
      - name: Run test suite
        run: python -m unittest discover --start-directory tests --verbose
  unittest-compiled:
    # Validates the mypyc-compiled wheels we actually ship (the `unittest` job
    # above covers the pure-Python wheel / .py source). Builds the real wheel,
    # installs it, and runs tests from a directory where the source tree can't
    # shadow the installed package.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # uv has no Windows ARM64 builds for Python < 3.11
        exclude:
          - os: windows-11-arm
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          activate-environment: true
      - name: Build the mypyc-compiled wheel
        env:
          HATCH_BUILD_HOOK_ENABLE_MYPYC: "1"
        run: uv build --wheel
      - name: Install the compiled wheel with extras
        # uv rejects --all-extras for a wheel path ("Use package[extra] syntax").
        # [torch] pulls numpy via its self-reference and self-skips on Windows ARM64.
        run: |
          $whl = (Get-ChildItem dist/*.whl)[0].FullName
          uv pip install "$whl[PIL,torch]"
      - name: Assert the installed package is actually compiled
        # Run from elsewhere so the ./d3dshot source tree doesn't shadow the install
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import d3dshot.d3dshot as m; assert m.__file__.endswith('.pyd'), m.__file__; print('compiled:', m.__file__)"
      - name: Run test suite against the installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover --start-directory $env:GITHUB_WORKSPACE\tests --top-level-directory $env:GITHUB_WORKSPACE\tests --verbose
